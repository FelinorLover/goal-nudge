<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="shared.css">
  <style>
    body { width: 280px; padding: 14px; }
    ul { list-style: none; padding: 0; margin: 8px 0 14px; }
    li { padding: 6px 10px; margin-bottom: 4px; border-radius: 5px; background: #1f2937; border-left: 2px solid #f59e0b; font-size: 13px; }
    li.empty { border-color: #374151; color: #6b7280; }
    .status { font-size: 12px; color: #9ca3af; margin: 0 0 10px; }
    .status.paused { color: #f59e0b; }
    .actions { display: flex; gap: 8px; }
    .actions button { flex: 1; padding: 8px 6px; font-size: 13px; }
    .pauses { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 8px; }
    .pauses button { flex: 1 1 calc(33% - 4px); padding: 7px 4px; font-size: 12px; }
    #today { margin: -6px 0 14px; }
    #today h2 { margin: 0 0 4px; font-size: 11px; }
    #today .budget-row { padding: 3px 0; font-size: 12px; }
    #resume { width: 100%; margin-bottom: 8px; }
  </style>
</head>
<body>
  <h1>Goal Nudge</h1>
  <p class="status" id="status"></p>
  <ul id="goals"></ul>
  <div id="today" hidden>
    <h2>Today</h2>
    <div id="todayList"></div>
  </div>
  <div class="pauses" id="pauses">
    <button class="ghost" data-minutes="30">30m</button>
    <button class="ghost" data-minutes="60">1h</button>
    <button class="ghost" data-minutes="180">3h</button>
    <button class="ghost" data-minutes="480">8h</button>
    <button class="ghost" data-minutes="today">Rest of today</button>
    <button class="ghost" data-minutes="10080">A week</button>
  </div>
  <button id="resume" hidden>Resume now</button>
  <div class="actions">
    <button class="ghost" id="settings">Settings</button>
  </div>
  <script src="defaults.js"></script>
  <script src="popup.js"></script>
</body>
</html>
